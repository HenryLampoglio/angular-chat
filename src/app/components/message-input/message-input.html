<div
  class="p-3.5 sm:p-4 bg-white/90 dark:bg-[#0c1220]/95 backdrop-blur-md border-t border-slate-200/80 dark:border-slate-800/80 transition-colors duration-200 shrink-0"
>
  <form (ngSubmit)="enviar()" class="max-w-5xl mx-auto flex items-center gap-2.5">
    <div class="relative flex-1 flex items-center">
      <input
        type="text"
        name="mensagem"
        [(ngModel)]="textoInput"
        autocomplete="off"
        placeholder="Escreva uma mensagem... (Pressione Enter para enviar)"
        class="w-full pl-5 pr-12 py-3 bg-slate-100/90 dark:bg-[#12192c] border border-slate-200/80 dark:border-slate-800 rounded-2xl text-sm text-slate-800 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-500 focus:bg-white dark:focus:bg-[#151d33] focus:outline-none focus:ring-2 focus:ring-emerald-400/50 dark:focus:ring-violet-500/50 focus:border-emerald-400 dark:focus:border-violet-500 transition-all duration-150 shadow-2xs"
      />
    </div>

    <button
      type="submit"
      [disabled]="!textoInput.trim()"
      [title]="textoInput.trim() ? 'Enviar mensagem' : 'Digite algo para enviar'"
      class="w-11 h-11 rounded-2xl flex items-center justify-center text-white bg-gradient-to-r from-emerald-500 to-teal-600 dark:from-violet-600 dark:to-indigo-600 shadow-md shadow-emerald-500/25 dark:shadow-violet-600/35 hover:shadow-lg hover:scale-105 active:scale-95 disabled:opacity-40 disabled:scale-100 disabled:shadow-none disabled:cursor-not-allowed transition-all duration-150 cursor-pointer shrink-0"
    >
      <mat-icon class="scale-90">send</mat-icon>
    </button>
  </form>
</div>
