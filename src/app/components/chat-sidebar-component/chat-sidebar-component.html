<aside
  class="w-80 lg:w-88 bg-white/90 dark:bg-[#0c1220]/95 backdrop-blur-md border-r border-slate-200/80 dark:border-slate-800/80 flex flex-col h-full shrink-0 transition-colors duration-200"
>
  <!-- Header da Sidebar -->
  <div class="p-5 border-b border-slate-200/70 dark:border-slate-800/80 space-y-3">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <h2 class="text-lg font-bold text-slate-800 dark:text-slate-100">Conversas</h2>
        <span
          class="px-2 py-0.5 text-xs font-semibold rounded-full bg-emerald-500/10 text-emerald-600 dark:bg-violet-500/15 dark:text-violet-300"
        >
          {{ recentChats().length }}
        </span>
      </div>
    </div>

    <!-- Filtro Rápido de Conversas -->
    <div class="relative flex items-center">
      <mat-icon class="absolute left-3.5 text-slate-400 dark:text-slate-500 scale-75 pointer-events-none"
        >filter_list</mat-icon
      >
      <input
        type="text"
        [ngModel]="searchTerm()"
        (ngModelChange)="searchTerm.set($event)"
        placeholder="Filtrar conversas..."
        class="w-full pl-9 pr-8 py-2 bg-slate-100/80 dark:bg-[#12192c] border border-slate-200/70 dark:border-slate-800/70 rounded-xl text-xs text-slate-800 dark:text-slate-200 placeholder:text-slate-400 dark:placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-400/40 dark:focus:ring-violet-500/40 transition-all"
      />
      @if (searchTerm()) {
        <button
          (click)="searchTerm.set('')"
          class="absolute right-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300"
        >
          <mat-icon class="scale-60">close</mat-icon>
        </button>
      }
    </div>
  </div>

  <!-- Lista de Conversas -->
  <div class="flex-1 overflow-y-auto custom-scroll p-2 space-y-1">
    @for (chat of filteredChats(); track chat.id) {
      <button
        (click)="selectChat(chat)"
        [ngClass]="
          chatState.chatIdAtivo() === chat.id
            ? 'bg-emerald-50/90 dark:bg-violet-950/40 border-l-4 border-emerald-500 dark:border-violet-500 shadow-xs'
            : 'hover:bg-slate-50 dark:hover:bg-[#131b2e] border-l-4 border-transparent'
        "
        class="w-full p-3.5 flex items-center gap-3.5 rounded-2xl transition-all duration-150 text-left cursor-pointer group"
      >
        <!-- Avatar com Indicador Online -->
        <div class="relative shrink-0">
          <div
            class="w-12 h-12 rounded-2xl bg-gradient-to-tr text-white flex items-center justify-center font-bold text-base shadow-sm ring-2 ring-white dark:ring-[#0c1220]"
            [ngClass]="chat.avatarColor"
          >
            {{ chat.name.charAt(0).toUpperCase() }}
          </div>

          @if (chat.online) {
            <span
              class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 bg-emerald-500 dark:bg-violet-400 border-2 border-white dark:border-[#0c1220] rounded-full shadow-xs"
            ></span>
          }
        </div>

        <!-- Conteúdo do Chat -->
        <div class="flex-1 min-w-0">
          <div class="flex items-center justify-between mb-1">
            <h3
              class="text-sm font-bold text-slate-800 dark:text-slate-100 truncate group-hover:text-emerald-600 dark:group-hover:text-violet-400 transition-colors"
            >
              {{ chat.name }}
            </h3>
            <span class="text-[11px] text-slate-400 dark:text-slate-500 shrink-0 ml-2 font-medium">
              {{ chat.time }}
            </span>
          </div>

          <div class="flex items-center justify-between gap-2">
            <p class="text-xs text-slate-500 dark:text-slate-400 truncate">
              {{ chat.lastMessage }}
            </p>

            @if (chat.unread > 0) {
              <span
                class="px-2 py-0.5 bg-emerald-500 dark:bg-violet-600 text-white text-[10px] font-bold rounded-full shrink-0 shadow-xs shadow-emerald-500/30 dark:shadow-violet-600/30"
              >
                {{ chat.unread }}
              </span>
            }
          </div>
        </div>
      </button>
    }

    @if (filteredChats().length === 0) {
      <div class="text-center py-12 px-4 text-slate-400 dark:text-slate-500">
        <mat-icon class="scale-125 mb-2 opacity-50">search_off</mat-icon>
        <p class="text-xs">Nenhuma conversa encontrada</p>
      </div>
    }
  </div>
</aside>
